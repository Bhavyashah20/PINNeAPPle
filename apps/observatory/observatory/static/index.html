<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PINNeAPPle Observatory</title>
<meta name="description" content="The sky and the solar system, now, from where you stand: JPL ephemerides, satellites, astrophysics and a physics-informed orbit surrogate with its trust checks.">
<meta name="theme-color" content="#05070d">
<link rel="stylesheet" href="/shared/app.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="labels"></div>
  <div id="fade"></div>
  <div id="reticle" hidden></div>
</div>

<header class="top obs-top">
  <div class="brand"><span class="logo">◐</span> PINNeAPPle <b>Observatory</b></div>
  <div class="loc">
    <button id="btnLocate" class="ghost" title="Use my location">⌖</button>
    <select id="city" title="Location"></select>
    <span id="locText" class="muted"></span>
  </div>
  <div class="view seg" role="tablist">
    <button id="vSky" class="on">Sky</button><button id="vSys">Solar system</button>
  </div>
  <div class="tools">
    <button id="btnGyro" class="ghost" title="Point your phone at the sky" hidden>📱 Point</button>
    <button id="btnPanel" class="ghost" title="Panels">☰</button>
  </div>
</header>

<div id="hud">
  <div class="time">
    <div id="clock" class="big">--</div>
    <div id="clockSub" class="muted">--</div>
  </div>
  <div class="tctl">
    <button id="tNow" class="ghost" title="Back to now">Now</button>
    <button id="tBack" class="ghost" title="Slower / reverse">◀◀</button>
    <button id="tPlay" class="ghost" title="Play / pause">❚❚</button>
    <button id="tFwd" class="ghost" title="Faster">▶▶</button>
    <span id="speed" class="pill">×1</span>
    <button id="tLayers" class="ghost" title="Layers">◎ Layers</button>
    <input id="tSlider" type="range" min="-720" max="720" value="0" step="1" title="Shift time ±12 h">
    <input id="tDate" type="datetime-local" title="Set date and time (local to your browser)">
  </div>
  <div class="layers" id="layers"></div>
</div>

<aside id="panel" class="open">
  <nav class="ptabs">
    <button data-tab="tonight" class="on">Tonight</button>
    <button data-tab="object">Object</button>
    <button data-tab="sats">Satellites</button>
    <button data-tab="analyses">Analyses</button>
    <button data-tab="engine">Engine</button>
  </nav>
  <section id="tab-tonight" class="pbody on"></section>
  <section id="tab-object" class="pbody"><p class="muted">Tap or click any star, planet, the Moon, the Sun or a satellite.</p></section>
  <section id="tab-sats" class="pbody"></section>
  <section id="tab-analyses" class="pbody"></section>
  <section id="tab-engine" class="pbody"></section>
  <footer class="foot pfoot"></footer>
</aside>

<div id="toast" hidden></div>

<script src="/shared/charts.js"></script>
<script src="/shared/author.js"></script>
<script type="importmap">{"imports": {"three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three/"}}</script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
