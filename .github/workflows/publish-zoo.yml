name: Publish zoo to the Hugging Face Hub

# Uploads every model and dataset of pinneapple_hub/zoo/manifest.json to huggingface.co/PINNeAPPle-Labs (one repo per
# item, tagged v<version>). Needs the repository secret HF_TOKEN (write access to the organisation); without it the
# job verifies the manifest, prints a warning and succeeds without uploading.
# The second job publishes the geometry library (pp.geometries): it rebuilds every file of both levels of detail,
# checks each against pinneapple_design/geometry_library/manifest.json, uploads them to the dataset
# PINNeAPPle-Labs/geometry-library and verifies the published files by anonymous download.

on:
  workflow_dispatch:
    inputs:
      staging_ref:
        description: "Branch holding the files of Hub-only items as <name>/<file> (empty: bundled items only)"
        required: false
        default: ""
  push:
    branches: ["main"]
    paths:
      - "pinneapple_hub/zoo/manifest.json"
      - "pinneapple_hub/zoo/assets/**"
      - "scripts/zoo/publish_to_hub.py"
      - "pinneapple_design/geometry_library/**"
      - "data/geometries/**"
      - "scripts/geometry_library.py"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HF_TOKEN != '' }}
      STAGING_REF: ${{ github.event.inputs.staging_ref || '' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out the staging files of Hub-only items
        if: ${{ env.STAGING_REF != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ env.STAGING_REF }}
          path: _zoo_staging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy "huggingface_hub>=0.24"
      - name: Check the manifest (SHA-256 of every file) and list the uploads
        run: python scripts/zoo/publish_to_hub.py --dry-run ${STAGING_REF:+--staging _zoo_staging}
      - name: Upload (skipped with a warning when HF_TOKEN is not set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/zoo/publish_to_hub.py ${STAGING_REF:+--staging _zoo_staging}
      - name: Verify the published files (anonymous download, SHA-256 against the manifest)
        if: ${{ env.HAS_TOKEN == 'true' }}
        run: python scripts/zoo/publish_to_hub.py --verify ${STAGING_REF:---allow-unpublished}

  geometries:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HF_TOKEN != '' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . "huggingface_hub>=0.24"
          # the versions the manifest was generated with (bit-identical rebuilds)
          pip install numpy==2.5.3 scipy==1.18.1 manifold3d==3.5.4
      - name: Build every geometry file (light and fine; STL, glTF, OBJ, USD, STEP)
        run: python scripts/geometry_library.py hub --out dist/geometries
      - name: Check every file against the manifest (SHA-256)
        run: python scripts/geometry_library.py verify --out dist/geometries
      - name: Upload (skipped with a warning when HF_TOKEN is not set)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/geometry_library.py upload --out dist/geometries
      - name: Verify the published files (anonymous download, SHA-256 against the manifest)
        if: ${{ env.HAS_TOKEN == 'true' }}
        run: python scripts/geometry_library.py verify-hub
