name: Geometry library (build, verify, upload to the Hub)

# Rebuilds every file of the geometry library (both levels of detail, every format), checks each one against the
# SHA-256 in pinneapple_design/geometry_library/manifest.json, and uploads them to the Hugging Face Hub dataset
# PINNeAPPle-Labs/geometry-library. The upload needs the repository secret HF_TOKEN (a write token of the
# PINNeAPPle-Labs organisation); without it the job still builds and verifies, and skips the upload with a warning.

on:
  push:
    branches: ["main"]
    paths:
      - "pinneapple_design/geometry_library/**"
      - "data/geometries/**"
      - "scripts/geometry_library.py"
      - ".github/workflows/geometry-library.yml"
  workflow_dispatch:

jobs:
  hub:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
          pip install manifold3d huggingface_hub

      - name: Build every file (light and fine, STL / glTF / OBJ / USD / STEP)
        run: python scripts/geometry_library.py hub --out dist/geometries

      - name: Verify the files against the manifest
        run: python scripts/geometry_library.py verify --out dist/geometries

      - name: Upload to the Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set; skipping the upload of the geometry library to the Hub"
            exit 0
          fi
          python scripts/geometry_library.py upload --out dist/geometries
