name: Playground (ONNX parity, JS unit tests, browser smoke test)

on:
  push:
    branches: ["main"]
    paths:
      - "apps/playground/**"
      - "pinneapple_hub/zoo/**"
      - "pinneapple_design/aero/**"
      - "pinneapple_design/geometry_library/**"
      - "data/geometries/**"
      - "tests/test_playground.py"
      - ".github/workflows/playground.yml"
  pull_request:
    paths:
      - "apps/playground/**"
      - "pinneapple_hub/zoo/**"
      - "pinneapple_design/aero/**"
      - "pinneapple_design/geometry_library/**"
      - "data/geometries/**"
      - "tests/test_playground.py"
      - ".github/workflows/playground.yml"
  workflow_dispatch:

jobs:
  onnx-parity:
    # The ONNX files the browser runs reproduce the zoo's PyTorch models to 1e-5 on the zoo test sets.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[export]" pytest
      - name: ONNX parity and stale-asset checks
        run: pytest tests/test_playground.py -q -p no:warnings

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/playground
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test runner
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: JS unit tests (geometry, preprocessing and the ONNX interpreter vs Python fixtures)
        run: node --test tests/unit/*.test.mjs
      - name: Browser smoke test (every mode, numbers vs the Python model; onnxruntime-web cross-check)
        run: npx playwright test
      - name: Size of the static build
        run: python3 build.py --out /tmp/playground-site

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (not pushed)
        run: docker build -f apps/playground/Dockerfile -t pinneapple-playground:ci .
      - name: Serve and fetch the page
        run: |
          docker run -d --name plg -p 8094:8094 pinneapple-playground:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8094/health && break; sleep 1; done
          curl -fsS http://localhost:8094/ | grep -q "PINNeAPPle Playground"
          curl -fsS -o /dev/null http://localhost:8094/models/airfoil_cst_rans_mlp.onnx
          curl -fsS -o /dev/null http://localhost:8094/geometries/viper_rover.light.glb
          docker rm -f plg
