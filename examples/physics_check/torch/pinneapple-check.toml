# A PINNeAPPle checkpoint (needs torch): scanned before loading (PC803), its training range read from the
# checkpoint metadata (domain_bounds), the queries checked against it (PC601).

[[model]]
name = "plate-pinn"
path = "models/plate_pinn.pt"
architecture = "vanilla_pinn"
config = { in_dim = 2, out_dim = 1, hidden = [16, 16] }
inputs = ["x", "y"]
outputs = ["T"]
queries = "models/queries.csv"

[[model]]
name = "plate-pinn-out-of-range"
path = "models/plate_pinn.pt"
architecture = "vanilla_pinn"
config = { in_dim = 2, out_dim = 1, hidden = [16, 16] }
inputs = ["x", "y"]
outputs = ["T"]
queries = "models/queries_out.csv"
